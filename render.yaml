services:
  - type: web
    name: weather-agent-holmes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      gunicorn --workers 1 --threads 4 --timeout 30 --access-logfile -
      --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEATHER_PROVIDER
        value: openmeteo
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: 30
