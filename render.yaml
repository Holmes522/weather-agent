services:
  - type: web
    name: weather-agent-holmes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      gunicorn --workers 1 --threads 4 --timeout 60 --access-logfile -
      --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEATHER_PROVIDER
        value: openmeteo
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: 30
      - key: AGENT_ENGINE
        value: langgraph
      - key: GEOCODING_API_URL
        value: https://nominatim.openstreetmap.org/search
      - key: GEOCODING_USER_AGENT
        value: weather-agent/1.0 (https://github.com/Holmes522/weather-agent)
